[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesfracx"
version = "0.1.0"
description = "Individual fracture extraction and DFN-ready characterization from 3D CT images"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "Matheos Giakoumi"},
    {name = "Bernard C. Chang"},
    {name = "Maša Prodanović"}
]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["bfx*"]